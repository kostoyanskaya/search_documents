services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      SESSION_COOKIE_SECURE: "true"
      CORS_ORIGINS: "https://${SITE_ADDRESS:-localhost}"
      ENABLE_METRICS: "true"
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 4g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/ready').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 120s

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    ports: ["80:80", "443:443"]
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS:-localhost}"
    volumes:
      # certificates and ACME account survive container re-creation
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
